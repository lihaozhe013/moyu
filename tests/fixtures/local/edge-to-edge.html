<!doctype html>
<html lang="en" data-local-fixture="edge-to-edge">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Edge-to-Edge Fixture</title>
    <style>
      html,
      body,
      main {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }

      main {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(135deg, #33204a, #173d4c);
        color: #f8f4ff;
        font:
          20px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main>Edge-to-edge local HTML</main>
  </body>
</html>
