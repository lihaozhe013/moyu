<!doctype html>
<html lang="en" data-local-fixture="minimal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Minimal Fixture</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #16212b;
        color: #eef5fb;
        font:
          20px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <main>Minimal local HTML</main>
  </body>
</html>
