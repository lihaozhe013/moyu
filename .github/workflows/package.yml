name: Package unsigned artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platformFlag: --win
            archFlag: --x64
            artifact: windows-x64
          - os: macos-13
            platformFlag: --mac
            archFlag: --x64
            artifact: macos-x64
          - os: macos-14
            platformFlag: --mac
            archFlag: --arm64
            artifact: macos-arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build && pnpm exec electron-builder --config electron-builder.yml ${{ matrix.platformFlag }} ${{ matrix.archFlag }}
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: professional-canvas-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
