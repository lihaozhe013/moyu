appId: com.moyu.app
productName: moyu
copyright: Copyright © 2026 moyu contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
icon: build/icon
mac:
  artifactName: moyu-mac-${arch}-${version}.${ext}
  category: public.app-category.graphics-design
  hardenedRuntime: true
  target:
    - dmg
    - zip
win:
  executableName: moyu
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: moyu-win-${arch}-${version}.${ext}
nsis:
  artifactName: moyu-win-${arch}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
portable:
  artifactName: moyu-win-${arch}-${version}-portable.${ext}
dmg:
  artifactName: moyu-mac-${arch}-${version}.${ext}
publish: null
